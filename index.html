<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Bienvenido</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --tinta: #0d1f14;
      --musgo: #0b3d24;
      --dorado: #c9a227;
      --dorado-oscuro: #97781a;
      --lino: #f2f1ec;
      --papel: #ffffff;
      --cobre: #97781a;
      --linea: #d6d3c4;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: auto;
      background: var(--lino);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      height: auto;
      background: var(--lino);
      font-family: 'Inter', sans-serif;
      color: var(--tinta);
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .franja-institucional {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: linear-gradient(
        90deg,
        var(--musgo) 0%,
        var(--musgo) 60%,
        var(--dorado) 60%,
        var(--dorado) 100%
      );
      z-index: 10;
    }

    .cabecera-institucional {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--dorado);
    }

    .espacio-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px dashed var(--linea);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: #9a9686;
      text-align: center;
      flex-shrink: 0;
      font-family: 'Inter', sans-serif;
    }

    .logo-institucional {
      width: 64px;
      height: 64px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .texto-institucional {
      line-height: 1.25;
    }

    .texto-institucional .linea1 {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--musgo);
      text-transform: uppercase;
    }

    .texto-institucional .linea2 {
      font-size: 0.85rem;
      color: #5c6b63;
    }

    .escena {
      min-height: 100vh;
      height: auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
    }

    .tarjeta {
      width: 100%;
      max-width: 760px;
      background: var(--papel);
      border-radius: 28px;
      padding: 56px 48px;
      box-shadow: 0 30px 60px rgba(20, 38, 31, 0.12);
      border: 1px solid var(--linea);
      margin: 20px 0;
    }

    .encabezado {
      text-align: left;
      margin-bottom: 40px;
    }

    .encabezado h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 2.4rem;
      margin: 0 0 8px 0;
      line-height: 1.1;
    }

    .encabezado p {
      margin: 0;
      color: #5c6b63;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      margin: 28px 0 10px 0;
      color: var(--musgo);
    }

    input[type="text"] {
      width: 100%;
      padding: 18px 20px;
      font-size: 1.3rem;
      border-radius: 14px;
      border: 2px solid var(--linea);
      background: var(--lino);
      font-family: 'Inter', sans-serif;
      color: var(--tinta);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--musgo);
    }

    .areas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 10px;
    }

    .area-btn {
      padding: 20px 18px;
      border-radius: 16px;
      border: 2px solid var(--linea);
      background: var(--lino);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--musgo);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
      min-height: 64px;
    }

    .area-btn:hover {
      border-color: var(--musgo);
    }

    .area-btn:active {
      transform: scale(0.97);
    }

    .area-btn.activa {
      background: var(--musgo);
      border-color: var(--musgo);
      color: var(--papel);
    }

    .enviar {
      width: 100%;
      margin-top: 36px;
      padding: 20px;
      font-size: 1.25rem;
      font-weight: 700;
      background: var(--cobre);
      color: var(--papel);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.15s ease, transform 0.1s ease;
      min-height: 64px;
    }

    .enviar:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .enviar:active:not(:disabled) {
      transform: scale(0.985);
    }

    .aviso {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #a13a2a;
      min-height: 20px;
      line-height: 1.4;
    }

    /* ============================================================
       PANTALLA DE CONFIRMACIÓN
       ============================================================ */

    .confirmacion {
      display: none;
      text-align: center;
      padding: 40px 0;
    }

    .confirmacion.visible {
      display: block;
    }

    .formulario.oculto {
      display: none;
    }

    .check {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--musgo);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px auto;
    }

    .check svg {
      width: 42px;
      height: 42px;
    }

    .confirmacion h2 {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      margin: 0 0 12px 0;
    }

    .confirmacion p {
      color: #5c6b63;
      font-size: 1.1rem;
      margin: 0;
      line-height: 1.5;
    }

    /* ============================================================
       TABLETS
       ============================================================ */

    @media (max-width: 800px) {

      .escena {
        padding: 30px 20px;
        align-items: flex-start;
      }

      .tarjeta {
        max-width: 700px;
        padding: 42px 32px;
        margin: 20px 0;
      }
    }

    /* ============================================================
       CELULARES
       ============================================================ */

    @media (max-width: 600px) {

      html,
      body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .franja-institucional {
        height: 6px;
      }

      .escena {
        width: 100%;
        min-height: 100vh;
        height: auto;
        padding: 22px 12px 40px 12px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }

      .tarjeta {
        width: 100%;
        max-width: 100%;
        padding: 28px 20px 32px 20px;
        border-radius: 20px;
        margin: 12px 0 20px 0;
      }

      .cabecera-institucional {
        gap: 12px;
        margin-bottom: 22px;
        padding-bottom: 16px;
      }

      .logo-institucional {
        width: 52px;
        height: 52px;
      }

      .texto-institucional {
        min-width: 0;
      }

      .texto-institucional .linea1 {
        font-size: 0.68rem;
      }

      .texto-institucional .linea2 {
        font-size: 0.75rem;
        line-height: 1.35;
      }

      .encabezado {
        margin-bottom: 24px;
      }

      .encabezado h1 {
        font-size: 2rem;
      }

      .encabezado p {
        font-size: 0.95rem;
        line-height: 1.5;
      }

      label {
        margin-top: 24px;
        margin-bottom: 9px;
      }

      input[type="text"] {
        padding: 16px;
        font-size: 1.1rem;
        min-height: 58px;
      }

      .areas {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .area-btn {
        padding: 16px;
        font-size: 1rem;
        min-height: 58px;
      }

      .enviar {
        margin-top: 28px;
        padding: 18px;
        font-size: 1.1rem;
        min-height: 60px;
      }

      .aviso {
        margin-top: 12px;
        font-size: 0.9rem;
      }

      .confirmacion {
        padding: 30px 0;
      }

      .confirmacion h2 {
        font-size: 1.8rem;
      }

      .confirmacion p {
        font-size: 1rem;
      }
    }

    /* ============================================================
       CELULARES MUY PEQUEÑOS
       ============================================================ */

    @media (max-width: 380px) {

      .escena {
        padding: 18px 8px 35px 8px;
      }

      .tarjeta {
        padding: 24px 16px 28px 16px;
        border-radius: 18px;
      }

      .cabecera-institucional {
        gap: 9px;
      }

      .logo-institucional {
        width: 46px;
        height: 46px;
      }

      .texto-institucional .linea1 {
        font-size: 0.62rem;
      }

      .texto-institucional .linea2 {
        font-size: 0.68rem;
      }

      .encabezado h1 {
        font-size: 1.8rem;
      }

      .encabezado p {
        font-size: 0.9rem;
      }

      input[type="text"] {
        font-size: 1rem;
      }

      .area-btn {
        font-size: 0.95rem;
      }

      .enviar {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="franja-institucional"></div>

  <div class="escena">

    <div class="tarjeta">

      <!-- FORMULARIO -->

      <div class="formulario" id="formulario">

        <div class="cabecera-institucional">

          <img
            src="./logo.png"
            alt="Comisaría Salaverry"
            class="logo-institucional"
          >

          <div class="texto-institucional">

            <div class="linea1">
              Comisaría Salaverry
            </div>

            <div class="linea2">
              Sistema de registro de visitantes
            </div>

          </div>

        </div>


        <div class="encabezado">

          <h1>Bienvenido</h1>

          <p>
            Ingrese su DNI, sus nombres y apellidos y seleccione
            el área a la que se dirige.
          </p>

        </div>


        <!-- DNI -->

        <label for="dni">
          Documento de identidad (DNI)
        </label>

        <input
          type="text"
          id="dni"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="8"
          placeholder="Ej. 12345678"
          autocomplete="off"
        >


        <!-- NOMBRES Y APELLIDOS -->

        <label for="nombre">
          Nombres y apellidos
        </label>

        <input
          type="text"
          id="nombre"
          maxlength="100"
          placeholder="Ej. Juan Carlos Pérez García"
          autocomplete="name"
        >


        <!-- ÁREA -->

        <label>
          Área que desea visitar
        </label>

        <div
          class="areas"
          id="areas"
        ></div>


        <button
          class="enviar"
          id="btnEnviar"
          disabled
        >
          Registrar visita
        </button>


        <div
          class="aviso"
          id="aviso"
          role="alert"
        ></div>

      </div>


      <!-- CONFIRMACIÓN -->

      <div
        class="confirmacion"
        id="confirmacion"
      >

        <div class="check">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fffdf8"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>

        </div>

        <h2 id="confNombre">
          Registro exitoso
        </h2>

        <p id="confTexto">
          Se notificó al área correspondiente.
          En breve será atendido.
        </p>

      </div>

    </div>

  </div>


  <script>

    // ============================================================
    // CONFIGURACIÓN SUPABASE
    // ============================================================

    const SUPABASE_URL =
      "https://cthpbxqwsjcgpdfqkdwr.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_qTNkWQAQLrzS2-81BpeDeA_DFDCrVol";


    // ============================================================
    // ÁREAS
    // ============================================================

    const AREAS = [
      "Sección de delitos y faltas",
      "Familia",
      "Policía comunitaria",
      "Secretaría",
      "Comisario"
    ];


    // ============================================================
    // CLIENTE SUPABASE
    // ============================================================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ============================================================
    // ELEMENTOS
    // ============================================================

    const contenedorAreas =
      document.getElementById("areas");

    const inputDni =
      document.getElementById("dni");

    const inputNombre =
      document.getElementById("nombre");

    const btnEnviar =
      document.getElementById("btnEnviar");

    const aviso =
      document.getElementById("aviso");

    const formulario =
      document.getElementById("formulario");

    const confirmacion =
      document.getElementById("confirmacion");

    const confNombre =
      document.getElementById("confNombre");


    let areaElegida = null;


    // ============================================================
    // CREAR BOTONES DE ÁREAS
    // ============================================================

    AREAS.forEach((area) => {

      const btn =
        document.createElement("button");

      btn.className = "area-btn";

      btn.type = "button";

      btn.textContent = area;


      btn.addEventListener("click", () => {

        areaElegida = area;


        document
          .querySelectorAll(".area-btn")
          .forEach((b) => {
            b.classList.remove("activa");
          });


        btn.classList.add("activa");

        revisarListo();

      });


      contenedorAreas.appendChild(btn);

    });


    // ============================================================
    // DNI
    // ============================================================

    inputDni.addEventListener("input", () => {

      inputDni.value =
        inputDni.value
          .replace(/\D/g, "")
          .slice(0, 8);

      revisarListo();

    });


    // ============================================================
    // NOMBRES Y APELLIDOS
    // ============================================================

    inputNombre.addEventListener("input", () => {

      inputNombre.value =
        inputNombre.value
          .replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s'-]/g, "")
          .replace(/\s+/g, " ")
          .slice(0, 100);

      revisarListo();

    });


    // ============================================================
    // VALIDAR FORMULARIO
    // ============================================================

    function revisarListo() {

      const dni =
        inputDni.value.trim();

      const nombre =
        inputNombre.value.trim();


      const dniOk =
        /^[0-9]{8}$/.test(dni);


      const nombreOk =
        /^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s'-]{3,100}$/.test(nombre) &&
        nombre.split(/\s+/).filter(Boolean).length >= 2;


      btnEnviar.disabled =
        !(dniOk && nombreOk && areaElegida);

    }


    // ============================================================
    // ENVIAR REGISTRO
    // ============================================================

    btnEnviar.addEventListener("click", async () => {

      const dni =
        inputDni.value.trim();

      const nombre =
        inputNombre.value.trim();


      if (!/^[0-9]{8}$/.test(dni)) {

        aviso.textContent =
          "Ingrese un DNI válido de 8 números.";

        return;

      }


      if (
        !nombre ||
        nombre.split(/\s+/).filter(Boolean).length < 2
      ) {

        aviso.textContent =
          "Ingrese sus nombres y apellidos.";

        return;

      }


      if (!areaElegida) {

        aviso.textContent =
          "Seleccione el área que desea visitar.";

        return;

      }


      btnEnviar.disabled = true;

      btnEnviar.textContent =
        "Procesando...";

      aviso.textContent = "";


      try {

        // ========================================================
        // INSERTAR EN SUPABASE
        // ========================================================

        const { error } =
          await supabaseClient
            .from("registros")
            .insert({
              dni: dni,
              nombre: nombre,
              area: areaElegida
            });


        if (error) {

          console.error(
            "Error de Supabase:",
            error
          );

          aviso.textContent =
            "No se pudo registrar. Intente nuevamente.";

          btnEnviar.disabled = false;

          btnEnviar.textContent =
            "Registrar visita";

          return;

        }


        // ========================================================
        // REGISTRO EXITOSO
        // ========================================================

        confNombre.textContent =
          "Registro exitoso";


        formulario.classList.add("oculto");

        confirmacion.classList.add("visible");


        // ========================================================
        // REINICIAR DESPUÉS DE 4 SEGUNDOS
        // ========================================================

        setTimeout(() => {

          inputDni.value = "";

          inputNombre.value = "";

          areaElegida = null;


          document
            .querySelectorAll(".area-btn")
            .forEach((b) => {
              b.classList.remove("activa");
            });


          btnEnviar.disabled = true;

          btnEnviar.textContent =
            "Registrar visita";

          aviso.textContent = "";


          confirmacion.classList.remove(
            "visible"
          );

          formulario.classList.remove(
            "oculto"
          );


          inputDni.focus();


          // Volver al inicio de la página
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }, 4000);


      } catch (error) {

        console.error(
          "Error inesperado:",
          error
        );

        aviso.textContent =
          "No se pudo conectar con el sistema. Intente nuevamente.";

        btnEnviar.disabled = false;

        btnEnviar.textContent =
          "Registrar visita";

      }

    });


    // ============================================================
    // AL CARGAR LA PÁGINA
    // ============================================================

    window.addEventListener("load", () => {

      inputDni.focus();

    });

  </script>

</body>
</html>
