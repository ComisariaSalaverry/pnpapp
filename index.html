<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comisaría Salaverry</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .contenedor {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .tarjeta {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .encabezado {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: #123c69;
    }

    .subtitulo {
      margin-top: 8px;
      color: #667085;
      font-size: 15px;
    }

    .descripcion {
      text-align: center;
      margin: 20px 0;
      color: #475467;
      line-height: 1.5;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #344054;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #123c69;
      box-shadow: 0 0 0 3px rgba(18,60,105,0.10);
    }

    .areas {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .area {
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      background: #fff;
      transition: 0.2s;
      text-align: center;
    }

    .area:hover {
      border-color: #123c69;
    }

    .area.seleccionada {
      background: #123c69;
      color: white;
      border-color: #123c69;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #123c69;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #0d3156;
    }

    button:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    .mensaje {
      display: none;
      text-align: center;
      padding: 25px 10px;
    }

    .mensaje .icono {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .mensaje h2 {
      color: #123c69;
      margin-bottom: 10px;
    }

    .mensaje p {
      color: #475467;
      line-height: 1.5;
    }

    .error {
      display: none;
      color: #d92d20;
      background: #fef3f2;
      border: 1px solid #fecdca;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 14px;
    }

    .pie {
      text-align: center;
      margin-top: 20px;
      color: #98a2b3;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .tarjeta {
        padding: 22px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="tarjeta">

      <!-- FORMULARIO -->
      <div id="formulario">

        <div class="encabezado">

          <!-- Si tienes tu logo, puedes mantener estos nombres -->
          <img
            src="./icon-192.png"
            alt="Comisaría Salaverry"
            class="logo"
          >

          <h1>Comisaría Salaverry</h1>

          <div class="subtitulo">
            Sistema de registro de visitantes
          </div>

        </div>

        <div class="descripcion">
          Ingrese su DNI, sus nombres y apellidos y seleccione
          el área a la que se dirige.
        </div>


        <!-- DNI -->
        <div class="campo">

          <label for="dni">
            Documento de identidad (DNI)
          </label>

          <input
            type="text"
            id="dni"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="8"
            placeholder="Ej. 12345678"
            autocomplete="off"
          >

        </div>


        <!-- NOMBRES -->
        <div class="campo">

          <label for="nombre">
            Nombres y apellidos
          </label>

          <input
            type="text"
            id="nombre"
            maxlength="100"
            placeholder="Ej. Juan Carlos Pérez García"
            autocomplete="name"
          >

        </div>


        <!-- ÁREA -->
        <div class="campo">

          <label>
            Área a la que se dirige
          </label>

          <div id="areas" class="areas"></div>

        </div>


        <div id="error" class="error"></div>


        <button
          id="btnEnviar"
          disabled
        >
          Registrar visita
        </button>


        <div class="pie">
          Comisaría Salaverry
        </div>

      </div>


      <!-- CONFIRMACIÓN -->
      <div id="mensajeExito" class="mensaje">

        <div class="icono">
          ✓
        </div>

        <h2>Registro realizado</h2>

        <p>
          Su visita ha sido registrada correctamente.
        </p>

        <p id="detalleRegistro"></p>

      </div>

    </div>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // ==========================================
    // CONFIGURACIÓN SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://cthpbxqwsjcgpdfqkdwr.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_qTNkWQAQLrzS2-81BpeDeA_DFDCrVol";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const inputDni =
      document.getElementById("dni");

    const inputNombre =
      document.getElementById("nombre");

    const areasContainer =
      document.getElementById("areas");

    const btnEnviar =
      document.getElementById("btnEnviar");

    const errorDiv =
      document.getElementById("error");

    const formulario =
      document.getElementById("formulario");

    const mensajeExito =
      document.getElementById("mensajeExito");

    const detalleRegistro =
      document.getElementById("detalleRegistro");


    // ==========================================
    // ÁREAS
    // ==========================================

    const AREAS = [
      "Sección de delitos y faltas",
      "Familia",
      "Policía comunitaria",
      "Secretaría",
      "Comisario"
    ];

    let areaElegida = "";


    AREAS.forEach((area) => {

      const div =
        document.createElement("div");

      div.className = "area";

      div.textContent = area;

      div.addEventListener("click", () => {

        document
          .querySelectorAll(".area")
          .forEach((elemento) => {
            elemento.classList.remove(
              "seleccionada"
            );
          });

        div.classList.add("seleccionada");

        areaElegida = area;

        revisarListo();

      });

      areasContainer.appendChild(div);

    });


    // ==========================================
    // VALIDACIÓN DNI
    // ==========================================

    inputDni.addEventListener("input", () => {

      inputDni.value =
        inputDni.value
          .replace(/\D/g, "")
          .slice(0, 8);

      revisarListo();

    });


    // ==========================================
    // VALIDACIÓN NOMBRE
    // ==========================================

    inputNombre.addEventListener("input", () => {

      inputNombre.value =
        inputNombre.value
          .replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s'-]/g, "")
          .replace(/\s+/g, " ")
          .slice(0, 100);

      revisarListo();

    });


    // ==========================================
    // REVISAR FORMULARIO
    // ==========================================

    function revisarListo() {

      const dniOk =
        /^[0-9]{8}$/.test(
          inputDni.value.trim()
        );


      const nombre =
        inputNombre.value.trim();


      const nombreOk =
        /^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s'-]{3,100}$/.test(
          nombre
        ) &&
        nombre.split(" ").filter(Boolean).length >= 2;


      btnEnviar.disabled =
        !(dniOk && nombreOk && areaElegida);

    }


    // ==========================================
    // MOSTRAR ERROR
    // ==========================================

    function mostrarError(mensaje) {

      errorDiv.textContent = mensaje;

      errorDiv.style.display = "block";

    }


    function ocultarError() {

      errorDiv.textContent = "";

      errorDiv.style.display = "none";

    }


    // ==========================================
    // ENVIAR REGISTRO
    // ==========================================

    btnEnviar.addEventListener("click", async () => {

      ocultarError();

      const dni =
        inputDni.value.trim();

      const nombre =
        inputNombre.value.trim();


      // Validación final

      if (!/^[0-9]{8}$/.test(dni)) {

        mostrarError(
          "El DNI debe tener exactamente 8 números."
        );

        return;
      }


      if (
        nombre.split(" ").filter(Boolean).length < 2
      ) {

        mostrarError(
          "Ingrese sus nombres y apellidos."
        );

        return;
      }


      if (!areaElegida) {

        mostrarError(
          "Seleccione un área."
        );

        return;
      }


      // Desactivar botón

      btnEnviar.disabled = true;

      btnEnviar.textContent =
        "Registrando...";


      try {

        const {
          error
        } = await supabaseClient
          .from("registros")
          .insert({
            dni: dni,
            nombre: nombre,
            area: areaElegida
          });


        if (error) {

          console.error(
            "Error de Supabase:",
            error
          );

          throw error;

        }


        // ==========================================
        // REGISTRO CORRECTO
        // ==========================================

        detalleRegistro.innerHTML =
          `
          <strong>${nombre}</strong><br>
          DNI: ${dni}<br>
          Área: ${areaElegida}
          `;


        formulario.style.display =
          "none";

        mensajeExito.style.display =
          "block";


      } catch (error) {

        console.error(error);

        mostrarError(
          "No se pudo registrar la visita. Inténtelo nuevamente."
        );

        btnEnviar.disabled = false;

        btnEnviar.textContent =
          "Registrar visita";

      }

    });

  </script>

</body>
</html>
