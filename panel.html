      --musgo:#0b3d24;

    }

    html{

      height:auto;
      overflow-x:hidden;
      overflow-y:auto;
    }

    body{

      min-height:100vh;

      background:var(--lino);

      color:var(--tinta);

      overflow-y:auto;
      -webkit-overflow-scrolling:touch;

    /* =========================
       LOGIN
    ========================= */

      min-height:100vh;

      align-items:center;

    .caja-login{
      width:100%;

      background:var(--papel);
      border:1px solid var(--linea);
      border-radius:20px;
      padding:40px 32px;
      box-shadow:0 20px 40px rgba(20,38,31,0.1);
    }

    .caja-login h1{
      font-family:'Fraunces',serif;
      font-size:1.7rem;
      margin:0 0 6px 0;
    }

    .caja-login p{
      margin:0 0 28px 0;
      color:#5c6b63;
      font-size:.95rem;
    }

    .caja-login label{
      display:block;
      font-weight:600;
      font-size:.85rem;
      margin:16px 0 6px 0;
      color:var(--musgo);
    }

    .caja-login input{
      width:100%;
      padding:13px 14px;
      border-radius:10px;
      border:2px solid var(--linea);
      background:var(--lino);
      font-size:1rem;
      font-family:'Inter',sans-serif;
      outline:none;
    }

    .caja-login input:focus{
      border-color:var(--musgo);
    }

    .caja-login button{
      width:100%;
      margin-top:22px;
      padding:14px;
      background:var(--musgo);
      color:var(--papel);
      border:none;
      border-radius:10px;
      font-weight:700;
      font-size:1rem;
      cursor:pointer;
    }

    .caja-login button:disabled{
      opacity:.7;
      cursor:not-allowed;
    }

    .error-login{
      color:var(--rojo);
      font-size:.88rem;
      margin-top:14px;
      min-height:18px;
    }

    ========================= */

      height:56px;
      object-fit:contain;

    }

    .cabecera-institucional-login{

      gap:14px;

      padding-bottom:18px;
      border-bottom:2px solid var(--dorado);

    .cabecera-institucional{

      justify-content:space-between;

      cursor:pointer;
      font-weight:600;

       FILTRO ADMIN

      font-weight:600;

      color:var(--papel);

    }

    ========================= */

      flex-direction:column;

      justify-content:space-between;

        border-color:var(--cobre);
      }

        border-color:var(--linea);
      }

      flex:1;

    }

      font-size:.85rem;

      margin-top:2px;

      gap:8px;

    }

      border:none;
      padding:9px 16px;
      border-radius:8px;
      font-weight:600;
      font-size:.85rem;
      cursor:pointer;
      white-space:nowrap;
      flex-shrink:0;
    }

    .estado-btn.pendiente{
      background:#fde8da;
      color:var(--cobre);
    }

    .estado-btn.atendido{
      background:#e2ede6;
      color:var(--verde);
    }

    .eliminar-btn{
      border:none;
      padding:9px 12px;
      border-radius:8px;
      font-weight:700;
      font-size:.85rem;
      cursor:pointer;
      white-space:nowrap;
      background:var(--rojo-fondo);
      color:var(--rojo);
    }

    .eliminar-btn:hover{
      background:#f2d4ce;
    }

    .eliminar-btn:active{
      transform:scale(.97);
    }


    /* =========================
       VACÍO
    ========================= */

    .vacio{
      text-align:center;
      padding:60px 20px;
      color:#5c6b63;
    }


    /* =========================

    ========================= */

      margin-bottom:18px;
      padding:13px;
      border-radius:12px;
      border:2px solid var(--musgo);
      background:var(--papel);
      color:var(--musgo);
      font-weight:700;
      font-size:.95rem;
      cursor:pointer;
      font-family:'Inter',sans-serif;
    }

    .btn-notificaciones.activo{
      background:var(--musgo);
      color:var(--papel);
      cursor:default;

      padding:4px 8px;
      border-radius:6px;
      background:#f3ead0;
      color:var(--cobre);
      font-size:.72rem;
      font-weight:700;

      .info-cliente .hora{

      }

    ========================= */

      }

      }

      .estado-btn,
      .eliminar-btn{
        width:100%;
        padding:10px;
      }

      .logo-institucional{
        width:48px;
        height:48px;
      }

      .cabecera h1{
        font-size:1.45rem;
      }

    }

  /* =====================================================

  function reproducirAviso(){

    try{

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioContext){
        return;
      }

      const ctx =
        new AudioContext();

      const osc =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      osc.type = "sine";

      osc.frequency.setValueAtTime(
        880,
        ctx.currentTime
      );

      osc.frequency.setValueAtTime(
        660,
        ctx.currentTime + 0.12
      );

      gain.gain.setValueAtTime(
        0.15,
        ctx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.4
      );

      osc.connect(gain);

      gain.connect(ctx.destination);

      osc.start();

      osc.stop(
        ctx.currentTime + 0.4
      );

    }catch(error){

      console.error(
        "Error de audio:",
        error
      );

    }

  }


  /* =====================================================
     SERVICE WORKER

  );


  async function iniciarSesion(){

    const correo =
      correoInput.value.trim();

    const clave =
      claveInput.value;


    errorLogin.textContent = "";


    if(!correo){

      errorLogin.textContent =
        "Ingrese su correo.";

      correoInput.focus();

      return;

    }


    if(!clave){

      errorLogin.textContent =
        "Ingrese su contraseña.";

      claveInput.focus();

      return;

    }


    btnEntrar.disabled = true;

    btnEntrar.textContent =

      console.log(

        error
      } =

          email:correo,

          password:clave

        console.error(

          error
        );

        errorLogin.textContent =
          "Correo o contraseña incorrectos.";

        return;

      console.log(
        "Login correcto:",

      );


      await entrarAlPanel();


    }catch(error){

        "Error inesperado:",
        error
      );

        "Ocurrió un error al iniciar sesión.";

    }finally{

      btnEntrar.disabled = false;

      btnEntrar.textContent =
        "Ingresar";

    }

  }


  /* =====================================================
     COMPROBAR SESIÓN
  ===================================================== */

  async function iniciar(){

    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if(error){

        console.error(
          "Error obteniendo sesión:",

        );

      }


      const session =
        data.session;


      if(session){

        );

        await entrarAlPanel();

      }

    }catch(error){

      console.error(
        "Error al comprobar sesión:",
        error
      );

    }

  }

        return;

      /* =================================================
         GUARDAR ÁREA Y ROL
      ================================================= */

      miArea =
        perfil.area;

      miRol =
        perfil.rol || "usuario";

      areaFiltroAdmin =

      /* =================================================

          "flex";

        activarBotonFiltro(
          "TODAS"
        );

      }else{

        nombreAreaEl.textContent =
          perfil.nombre_area_visible ||
          perfil.area ||
          "Registros";

        subtituloPanel.textContent =
          "Se actualiza automáticamente al llegar un nuevo registro";

        filtroAdmin.style.display =
          "none";

      }


      /* =================================================
         MOSTRAR PANEL
      ================================================= */

      vistaLogin.style.display =
        "none";

      vistaPanel.style.display =
        "block";


      /* =================================================
         CARGAR REGISTROS
      ================================================= */

      await cargarRegistros();


      /* =================================================
         ESCUCHAR REGISTROS NUEVOS
      ================================================= */

      escucharNuevos();


    }catch(error){

      console.error(
        "Error entrando al panel:",
        error
      );

      errorLogin.textContent =
        "No se pudo abrir el panel.";

    }

  }


  /* =====================================================
     FILTROS ADMIN
  ===================================================== */

  document
    .querySelectorAll(".filtro-area")
    .forEach(boton => {

      boton.addEventListener(
        "click",
        async () => {

          const area =
            boton.dataset.area;

          areaFiltroAdmin =
            area;

          activarBotonFiltro(
            area
          );

          await cargarRegistros();

        }
      );

    });


  function activarBotonFiltro(area){

    document
      .querySelectorAll(".filtro-area")
      .forEach(boton => {

        boton.classList.toggle(
          "activo",
          boton.dataset.area === area
        );

      });

  }


  /* =====================================================
     CERRAR SESIÓN
  ===================================================== */

  btnSalir.addEventListener(
    "click",
    async () => {

      try{

        if(canalRegistros){

          await supabaseClient
            .removeChannel(
              canalRegistros
            );

          canalRegistros = null;

        }


        await supabaseClient.auth.signOut();

        location.reload();

      }catch(error){

        console.error(
          "Error cerrando sesión:",
          error
        );

      }

    }
  );


  /* =====================================================
     FORMATO DE FECHA
  ===================================================== */

  function formatoHora(fechaISO){

    if(!fechaISO){
      return "";
    }

    const fecha =
      new Date(fechaISO);

    return fecha.toLocaleString(
      "es-PE",
      {
        day:"2-digit",
        month:"short",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }


  /* =====================================================
     SEGURIDAD HTML
  ===================================================== */

  function escaparHTML(texto){

    const div =
      document.createElement("div");

    div.textContent =
      texto ?? "";

    return div.innerHTML;

  }


  /* =====================================================
     PINTAR REGISTRO
  ===================================================== */

  function pintarFila(
    registro,
    esNueva
  ){

    const fila =
      document.createElement("div");


    fila.className =
      "fila" +
      (
        esNueva
          ? " nueva"
          : ""
      );


    fila.id =
      "reg-" +
      registro.id;


    const nombre =
      registro.nombre ||
      "Visitante";


    const dni =
      registro.dni ||
      "No registrado";


    const area =
      registro.area ||
      "Sin área";


    fila.innerHTML = `

      <div class="info-cliente">

        <div class="nombre">
          ${escaparHTML(nombre)}
        </div>

        <div class="dni">
          DNI ${escaparHTML(dni)}
        </div>

        ${
          miRol === "admin"
            ? `
              <div class="area">
                Área: ${escaparHTML(area)}
              </div>
            `
            : ""
        }

        <div class="hora">
          ${formatoHora(registro.creado_en)}
        </div>

      </div>


      <div class="acciones-registro">

        <button
          class="estado-btn ${
            registro.atendido
              ? "atendido"
              : "pendiente"
          }"
        >

          ${
            registro.atendido
              ? "Atendido"
              : "Marcar atendido"
          }

        </button>

        ${
          miRol === "admin"
            ? `
              <button
                class="eliminar-btn"
                type="button"
                title="Eliminar registro"
              >
                🗑️ Eliminar
              </button>
            `
            : ""
        }

      </div>

    `;


    /* =====================================================
       BOTÓN ATENDIDO
    ===================================================== */

    const botonEstado =
      fila.querySelector(".estado-btn");


    botonEstado.addEventListener(
      "click",
      () => {

        marcarAtendido(
          registro.id,
          fila
        );

      }
    );


    /* =====================================================
       BOTÓN ELIMINAR
    ===================================================== */

    if(miRol === "admin"){

      const botonEliminar =
        fila.querySelector(".eliminar-btn");


      botonEliminar.addEventListener(
        "click",
        () => {

          eliminarRegistro(
            registro.id,
            fila,
            nombre
          );

        }
      );

    }


    return fila;

  }


  /* =====================================================
     MARCAR ATENDIDO
  ===================================================== */

  async function marcarAtendido(
    id,
    fila
  ){

    try{

      const {
        error
      } =
        await supabaseClient
          .from("registros")
          .update({
            atendido:true
          })
          .eq(
            "id",
            id
          );


      if(error){

        console.error(
          "Error marcando atendido:",
          error
        );

        alert(
          "No se pudo actualizar el registro."
        );

        return;

      }


      const boton =
        fila.querySelector(
          ".estado-btn"
        );


      boton.textContent =
        "Atendido";


      boton.className =
        "estado-btn atendido";


    }catch(error){

      console.error(
        "Error:",
        error
      );

    }

  }


  /* =====================================================
     ELIMINAR REGISTRO
  ===================================================== */

  async function eliminarRegistro(
    id,
    fila,
    nombre
  ){

    /* Seguridad adicional en el frontend */

    if(miRol !== "admin"){

      alert(
        "No tienes permiso para eliminar registros."
      );

      return;

    }


    const confirmar =
      confirm(
        `¿Seguro que deseas eliminar el registro de "${nombre}"?\n\nEsta acción no se puede deshacer.`
      );


    if(!confirmar){
      return;
    }


    const botonEliminar =
      fila.querySelector(
        ".eliminar-btn"
      );


    botonEliminar.disabled =
      true;

    botonEliminar.textContent =
      "Eliminando...";


    try{

      const {
        error
      } =
        await supabaseClient
          .from("registros")
          .delete()
          .eq(
            "id",
            id
          );


      if(error){

        console.error(
          "Error eliminando registro:",
          error
        );

        alert(
          "No se pudo eliminar el registro. Verifica los permisos de Supabase."
        );

        botonEliminar.disabled =
          false;

        botonEliminar.textContent =
          "🗑️ Eliminar";

        return;

      }


      /* Quitar de la pantalla */

      fila.remove();


      /* Si ya no quedan registros */

      if(
        lista.children.length === 0
      ){

        lista.innerHTML =
          '<div class="vacio">Todavía no hay registros.</div>';

      }


    }catch(error){

      console.error(
        "Error inesperado eliminando:",
        error
      );

      alert(
        "Ocurrió un error al eliminar el registro."
      );

      botonEliminar.disabled =
        false;

      botonEliminar.textContent =
        "🗑️ Eliminar";

    }

  }


  /* =====================================================
     CARGAR REGISTROS
  ===================================================== */

  async function cargarRegistros(){

    lista.innerHTML =
      '<div class="vacio">Cargando registros...</div>';


    try{

      let consulta =
        supabaseClient
          .from("registros")
          .select("*")
          .order(
            "creado_en",
            {
              ascending:false
            }
          )
          .limit(50);


      if(miRol === "admin"){

        if(areaFiltroAdmin !== "TODAS"){

          consulta =
            consulta.eq(
              "area",
              areaFiltroAdmin
            );

        }

      }else{

        consulta =
          consulta.eq(
            "area",
            miArea
          );

      }


      const {
        data,
        error
      } =
        await consulta;


      if(error){

        console.error(
          "Error cargando registros:",
          error
        );

        lista.innerHTML =
          '<div class="vacio">No se pudieron cargar los registros.</div>';

        return;

      }


      lista.innerHTML = "";


      if(
        !data ||
        data.length === 0
      ){

        if(miRol === "admin"){

          lista.innerHTML =
            areaFiltroAdmin === "TODAS"
              ? '<div class="vacio">Todavía no hay registros.</div>'
              : `<div class="vacio">Todavía no hay registros para ${escaparHTML(areaFiltroAdmin)}.</div>`;

        }else{

          lista.innerHTML =
            '<div class="vacio">Todavía no hay registros para tu área.</div>';

        }

        return;

      }


      data.forEach(
        registro => {

          lista.appendChild(
            pintarFila(
              registro,
              false
            )
          );

        }
      );


    }catch(error){

      console.error(
        "Error:",
        error
      );

      lista.innerHTML =
        '<div class="vacio">Ocurrió un error cargando los registros.</div>';

    }

  }


  /* =====================================================
     REGISTROS EN TIEMPO REAL
  ===================================================== */

  function escucharNuevos(){

    if(canalRegistros){

      supabaseClient
        .removeChannel(
          canalRegistros
        );

    }


    canalRegistros =
      supabaseClient

        .channel(
          "registros-en-vivo"
        )

        .on(

          "postgres_changes",

          {
            event:"INSERT",
            schema:"public",
            table:"registros"
          },

          payload => {

            console.log(
              "Nuevo registro recibido:",
              payload.new
            );


            if(
              miRol !== "admin" &&
              payload.new.area &&
              miArea &&
              payload.new.area !== miArea
            ){

              return;

            }


            if(
              miRol === "admin" &&
              areaFiltroAdmin !== "TODAS" &&
              payload.new.area !== areaFiltroAdmin
            ){

              return;

            }


            const vacio =
              lista.querySelector(
                ".vacio"
              );


            if(vacio){

              vacio.remove();

            }


            const existente =
              document.getElementById(
                "reg-" + payload.new.id
              );


            if(existente){

              return;

            }


            lista.prepend(
              pintarFila(
                payload.new,
                true
              )
            );


            reproducirAviso();

          }

        )

        .subscribe(
          status => {

            console.log(
              "Estado Realtime:",
              status
            );

          }
        );

  }


  /* =====================================================
     NOTIFICACIONES
  ===================================================== */

  btnNotificaciones.addEventListener(
    "click",
    activarNotificaciones
  );


  async function activarNotificaciones(){

    try{

      if(
        !("Notification" in window)
      ){

        alert(
          "Este navegador no soporta notificaciones."
        );

        return;

      }


      if(
        !("serviceWorker" in navigator) ||
        !("PushManager" in window)
      ){

        alert(
          "Este navegador no soporta notificaciones push."
        );

        return;

      }


      if(
        VAPID_PUBLIC_KEY ===
        "TU-VAPID-PUBLIC-KEY"
      ){

        alert(
          "Las notificaciones push todavía no están configuradas. Primero debemos agregar la clave VAPID."
        );

        return;

      }


      const permiso =
        await Notification.requestPermission();


      if(
        permiso !== "granted"
      ){

        alert(
          "No se activaron las notificaciones."
        );

        return;

      }


      const registro =
        await navigator.serviceWorker.ready;


      const suscripcion =
        await registro.pushManager.subscribe({

          userVisibleOnly:true,

          applicationServerKey:
            urlBase64AUint8Array(
              VAPID_PUBLIC_KEY
            )

        });


      const {
        data,
        error:userError
      } =
        await supabaseClient.auth.getUser();


      const user =
        data.user;


      if(
        userError ||
        !user
      ){

        alert(
          "No se pudo identificar al usuario."
        );

        return;

      }


      const areaSuscripcion =
        miRol === "admin"
          ? "TODAS"
          : miArea;


      const {
        error
      } =
        await supabaseClient
          .from("push_suscripciones")
          .insert({

            usuario_id:user.id,

            area:areaSuscripcion,

            suscripcion:
              suscripcion.toJSON()

          });


      if(error){

        console.error(
          "Error guardando suscripción:",
          error
        );

        alert(
          "No se pudo guardar la suscripción."
        );

        return;

      }


      btnNotificaciones.textContent =
        "🔔 Notificaciones activadas en este dispositivo";


      btnNotificaciones.classList.add(
        "activo"
      );


      btnNotificaciones.disabled =
        true;


    }catch(error){

      console.error(
        "Error activando notificaciones:",
        error
      );

      alert(
        "Ocurrió un error al activar las notificaciones."
      );

    }

  }


  /* =====================================================
     CONVERSIÓN VAPID
  ===================================================== */

  function urlBase64AUint8Array(
    base64String
  ){

    const padding =
      "=".repeat(
        (4 - (
          base64String.length % 4
        )) % 4
      );


    const base64 =
      (
        base64String + padding
      )
      .replace(
        /-/g,
        "+"
      )
      .replace(
        /_/g,
        "/"
      );


    const rawData =
      atob(base64);


    return Uint8Array.from(
      [...rawData].map(
        character =>
          character.charCodeAt(0)
      )
    );

  }


  /* =====================================================
     INICIAR SISTEMA
  ===================================================== */

  iniciar();

</script>
