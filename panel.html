<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel de registros</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root{
      --tinta:#0d1f14;
      --musgo:#0b3d24;
      --lino:#f2f1ec;
      --papel:#ffffff;
      --cobre:#97781a;
      --linea:#d6d3c4;
      --verde:#3c7a56;
      --dorado:#c9a227;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      background:var(--lino);
      font-family:'Inter',sans-serif;
      color:var(--tinta);
    }

    /* =========================
       LOGIN
    ========================= */

    #vistaLogin{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .caja-login{
      width:100%;
      max-width:400px;
      background:var(--papel);
      border:1px solid var(--linea);
      border-radius:20px;
      padding:40px 32px;
      box-shadow:0 20px 40px rgba(20,38,31,0.1);
    }

    .caja-login h1{
      font-family:'Fraunces',serif;
      font-size:1.7rem;
      margin:0 0 6px 0;
    }

    .caja-login p{
      margin:0 0 28px 0;
      color:#5c6b63;
      font-size:0.95rem;
    }

    .caja-login label{
      display:block;
      font-weight:600;
      font-size:0.85rem;
      margin:16px 0 6px 0;
      color:var(--musgo);
    }

    .caja-login input{
      width:100%;
      padding:13px 14px;
      border-radius:10px;
      border:2px solid var(--linea);
      background:var(--lino);
      font-size:1rem;
      font-family:'Inter',sans-serif;
      outline:none;
    }

    .caja-login input:focus{
      border-color:var(--musgo);
    }

    .caja-login button{
      width:100%;
      margin-top:22px;
      padding:14px;
      background:var(--musgo);
      color:var(--papel);
      border:none;
      border-radius:10px;
      font-weight:700;
      font-size:1rem;
      cursor:pointer;
    }

    .caja-login button:disabled{
      opacity:.7;
      cursor:not-allowed;
    }

    .error-login{
      color:#a13a2a;
      font-size:.88rem;
      margin-top:14px;
      min-height:18px;
    }

    /* =========================
       LOGO
    ========================= */

    .logo-institucional{
      width:56px;
      height:56px;
      object-fit:contain;
      flex-shrink:0;
    }

    .cabecera-institucional-login{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:24px;
      padding-bottom:18px;
      border-bottom:2px solid var(--dorado);
    }

    .cabecera-institucional{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .texto-institucional .linea1{
      font-size:.75rem;
      font-weight:700;
      letter-spacing:.02em;
      color:var(--musgo);
      text-transform:uppercase;
    }

    .texto-institucional .linea2{
      font-size:.85rem;
      color:#5c6b63;
    }

    /* =========================
       PANEL
    ========================= */

    #vistaPanel{
      display:none;
      max-width:840px;
      margin:0 auto;
      padding:36px 24px 60px 24px;
    }

    .cabecera{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:28px;
      flex-wrap:wrap;
      gap:14px;
    }

    .cabecera h1{
      font-family:'Fraunces',serif;
      font-size:1.9rem;
      margin:0;
    }

    .cabecera .sub{
      color:#5c6b63;
      font-size:.9rem;
    }

    .salir{
      background:none;
      border:1px solid var(--linea);
      color:var(--musgo);
      padding:8px 14px;
      border-radius:8px;
      font-size:.85rem;
      cursor:pointer;
      font-weight:600;
    }

    .lista{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .fila{
      background:var(--papel);
      border:1px solid var(--linea);
      border-radius:14px;
      padding:16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .fila.nueva{
      animation:resaltar 1.8s ease;
    }

    @keyframes resaltar{

      0%{
        background:#fdf0e4;
        border-color:var(--cobre);
      }

      100%{
        background:var(--papel);
        border-color:var(--linea);
      }

    }

    .info-cliente .nombre{
      font-weight:700;
      font-size:1.05rem;
    }

    .info-cliente .hora{
      color:#5c6b63;
      font-size:.82rem;
      margin-top:2px;
    }

    .estado-btn{
      border:none;
      padding:9px 16px;
      border-radius:8px;
      font-weight:600;
      font-size:.85rem;
      cursor:pointer;
    }

    .estado-btn.pendiente{
      background:#fde8da;
      color:var(--cobre);
    }

    .estado-btn.atendido{
      background:#e2ede6;
      color:var(--verde);
    }

    .vacio{
      text-align:center;
      padding:60px 20px;
      color:#5c6b63;
    }

    /* =========================
       NOTIFICACIONES
    ========================= */

    .btn-notificaciones{
      width:100%;
      margin-bottom:18px;
      padding:13px;
      border-radius:12px;
      border:2px solid var(--musgo);
      background:var(--papel);
      color:var(--musgo);
      font-weight:700;
      font-size:.95rem;
      cursor:pointer;
      font-family:'Inter',sans-serif;
    }

    .btn-notificaciones.activo{
      background:var(--musgo);
      color:var(--papel);
      cursor:default;
    }

  </style>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1f3d31">

</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="vistaLogin">

  <div class="caja-login">

    <div class="cabecera-institucional-login">

      <img
        src="./logo.png"
        alt="Policía Nacional del Perú"
        class="logo-institucional"
      >

      <div class="texto-institucional">

        <div class="linea1">
          Policía Nacional del Perú
        </div>

        <div class="linea2">
          Panel de área
        </div>

      </div>

    </div>

    <p>
      Ingrese con la cuenta de su área para ver los registros.
    </p>

    <label for="correo">
      Correo
    </label>

    <input
      type="email"
      id="correo"
      autocomplete="username"
      placeholder="correo@pnp.local"
    >

    <label for="clave">
      Contraseña
    </label>

    <input
      type="password"
      id="clave"
      autocomplete="current-password"
    >

    <button id="btnEntrar">
      Ingresar
    </button>

    <div
      class="error-login"
      id="errorLogin"
    ></div>

  </div>

</div>


<!-- =====================================================
     PANEL
===================================================== -->

<div id="vistaPanel">

  <div class="cabecera">

    <div class="cabecera-institucional">

      <img
        src="./logo.png"
        alt="Policía Nacional del Perú"
        class="logo-institucional"
      >

      <div>

        <h1 id="nombreArea">
          Registros
        </h1>

        <div class="sub">
          Se actualiza automáticamente al llegar un nuevo registro
        </div>

      </div>

    </div>

    <button
      class="salir"
      id="btnSalir"
    >
      Cerrar sesión
    </button>

  </div>


  <button
    id="btnNotificaciones"
    class="btn-notificaciones"
  >
    🔔 Activar notificaciones en este dispositivo
  </button>


  <div
    class="lista"
    id="lista"
  ></div>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

  /* =====================================================
     CONFIGURACIÓN SUPABASE
  ===================================================== */

  const SUPABASE_URL =
    "https://cthpbxqwsjcgpdfqkdwr.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_qTNkWQAQLrzS2-81BpeDeA_DFDCrVol";


  /*
    Esta clave NO es la contraseña de ningún usuario.

    Las notificaciones push todavía necesitan
    una VAPID PUBLIC KEY real.

    Por ahora dejamos esto sin activar.
  */

const VAPID_PUBLIC_KEY =
  "BHG6sCGAQQmYuGMRmrJ4EYKd55Bzngbc7WQdJuFpjHgFzs-zbQYQeof-yerGrD_yjIqQijnzdvqySvrehpeZgUA";

/*
  IMPORTANTE:
    ESTA ES LA ÚNICA DECLARACIÓN DE supabase.
  */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* =====================================================
     ELEMENTOS HTML
  ===================================================== */

  const vistaLogin =
    document.getElementById("vistaLogin");

  const vistaPanel =
    document.getElementById("vistaPanel");

  const btnEntrar =
    document.getElementById("btnEntrar");

  const btnSalir =
    document.getElementById("btnSalir");

  const btnNotificaciones =
    document.getElementById("btnNotificaciones");

  const errorLogin =
    document.getElementById("errorLogin");

  const nombreAreaEl =
    document.getElementById("nombreArea");

  const lista =
    document.getElementById("lista");

  const correoInput =
    document.getElementById("correo");

  const claveInput =
    document.getElementById("clave");


  /* =====================================================
     VARIABLE DEL ÁREA
  ===================================================== */

  let miArea = null;

  let canalRegistros = null;


  /* =====================================================
     SONIDO
  ===================================================== */

  function reproducirAviso(){

    try{

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioContext){
        return;
      }

      const ctx =
        new AudioContext();

      const osc =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      osc.type = "sine";

      osc.frequency.setValueAtTime(
        880,
        ctx.currentTime
      );

      osc.frequency.setValueAtTime(
        660,
        ctx.currentTime + 0.12
      );

      gain.gain.setValueAtTime(
        0.15,
        ctx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.4
      );

      osc.connect(gain);

      gain.connect(ctx.destination);

      osc.start();

      osc.stop(
        ctx.currentTime + 0.4
      );

    }catch(error){

      console.error(
        "Error de audio:",
        error
      );

    }

  }


  /* =====================================================
     SERVICE WORKER
  ===================================================== */

  if(
    "serviceWorker" in navigator
  ){

    navigator.serviceWorker
      .register("./sw.js")
      .then(() => {

        console.log(
          "Service Worker registrado."
        );

      })
      .catch(error => {

        console.error(
          "Error registrando Service Worker:",
          error
        );

      });

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  btnEntrar.addEventListener(
    "click",
    iniciarSesion
  );


  /*
    También permite presionar ENTER
    en los campos del formulario.
  */

  correoInput.addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){
        iniciarSesion();
      }

    }
  );


  claveInput.addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){
        iniciarSesion();
      }

    }
  );


  async function iniciarSesion(){

    const correo =
      correoInput.value.trim();

    const clave =
      claveInput.value;


    errorLogin.textContent = "";


    if(!correo){

      errorLogin.textContent =
        "Ingrese su correo.";

      correoInput.focus();

      return;

    }


    if(!clave){

      errorLogin.textContent =
        "Ingrese su contraseña.";

      claveInput.focus();

      return;

    }


    btnEntrar.disabled = true;

    btnEntrar.textContent =
      "Ingresando...";


    try{

      console.log(
        "Intentando iniciar sesión..."
      );


      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email:correo,

          password:clave

        });


      if(error){

        console.error(
          "Error de Supabase:",
          error
        );

        errorLogin.textContent =
          "Correo o contraseña incorrectos.";

        return;

      }


      console.log(
        "Login correcto:",
        data.user.email
      );


      await entrarAlPanel();


    }catch(error){

      console.error(
        "Error inesperado:",
        error
      );

      errorLogin.textContent =
        "Ocurrió un error al iniciar sesión.";

    }finally{

      btnEntrar.disabled = false;

      btnEntrar.textContent =
        "Ingresar";

    }

  }


  /* =====================================================
     COMPROBAR SESIÓN AL CARGAR
  ===================================================== */

  async function iniciar(){

    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if(error){

        console.error(
          "Error obteniendo sesión:",
          error
        );

        return;

      }


      const session =
        data.session;


      if(session){

        console.log(
          "Sesión existente encontrada."
        );

        await entrarAlPanel();

      }

    }catch(error){

      console.error(
        "Error al comprobar sesión:",
        error
      );

    }

  }


  /* =====================================================
     ENTRAR AL PANEL
  ===================================================== */

  async function entrarAlPanel(){

    try{

      /*
        Obtener usuario autenticado.
      */

      const {
        data,
        error:userError
      } =
        await supabaseClient.auth.getUser();


      const user =
        data.user;


      if(
        userError ||
        !user
      ){

        console.error(
          "No se pudo obtener usuario:",
          userError
        );

        errorLogin.textContent =
          "No se pudo obtener el usuario.";

        return;

      }


      console.log(
        "UID del usuario:",
        user.id
      );


      console.log(
        "Correo:",
        user.email
      );


      /*
        BUSCAMOS EL PERFIL MEDIANTE EL UID.

        auth.users.id
              =
        perfiles.id
      */

      const {
        data:perfil,
        error
      } =
        await supabaseClient
          .from("perfiles")
          .select(
            "area, nombre_area_visible"
          )
          .eq(
            "id",
            user.id
          )
          .single();


      if(error){

        console.error(
          "Error obteniendo perfil:",
          error
        );

        errorLogin.textContent =
          "No se pudo obtener el área de esta cuenta.";

        return;

      }


      if(!perfil){

        errorLogin.textContent =
          "Esta cuenta no tiene un área asignada.";

        return;

      }


      /*
        Guardamos el área.
      */

      miArea =
        perfil.area;


      console.log(
        "Área del usuario:",
        miArea
      );


      /*
        Mostramos el nombre del área.
      */

      nombreAreaEl.textContent =
        perfil.nombre_area_visible ||
        perfil.area ||
        "Registros";


      /*
        Cambiamos de login a panel.
      */

      vistaLogin.style.display =
        "none";

      vistaPanel.style.display =
        "block";


      /*
        Cargar registros.
      */

      await cargarRegistros();


      /*
        Escuchar registros nuevos.
      */

      escucharNuevos();


    }catch(error){

      console.error(
        "Error entrando al panel:",
        error
      );

      errorLogin.textContent =
        "No se pudo abrir el panel.";

    }

  }


  /* =====================================================
     CERRAR SESIÓN
  ===================================================== */

  btnSalir.addEventListener(
    "click",
    async () => {

      try{

        if(canalRegistros){

          await supabaseClient
            .removeChannel(
              canalRegistros
            );

          canalRegistros = null;

        }


        await supabaseClient.auth.signOut();

        location.reload();

      }catch(error){

        console.error(
          "Error cerrando sesión:",
          error
        );

      }

    }
  );


  /* =====================================================
     FORMATO DE FECHA
  ===================================================== */

  function formatoHora(fechaISO){

    if(!fechaISO){
      return "";
    }

    const fecha =
      new Date(fechaISO);

    return fecha.toLocaleString(
      "es-PE",
      {
        day:"2-digit",
        month:"short",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }


  /* =====================================================
     SEGURIDAD HTML
  ===================================================== */

  function escaparHTML(texto){

    const div =
      document.createElement("div");

    div.textContent =
      texto ?? "";

    return div.innerHTML;

  }


  /* =====================================================
     PINTAR REGISTRO
  ===================================================== */

  function pintarFila(
    registro,
    esNueva
  ){

    const fila =
      document.createElement("div");


    fila.className =
      "fila" +
      (
        esNueva
          ? " nueva"
          : ""
      );


    fila.id =
      "reg-" +
      registro.id;


    fila.innerHTML = `

      <div class="info-cliente">

        <div class="nombre">

          DNI ${escaparHTML(
            registro.nombre
          )}

        </div>

        <div class="hora">

          ${formatoHora(
            registro.creado_en
          )}

        </div>

      </div>


      <button
        class="estado-btn ${
          registro.atendido
            ? "atendido"
            : "pendiente"
        }"
      >

        ${
          registro.atendido
            ? "Atendido"
            : "Marcar atendido"
        }

      </button>

    `;


    const boton =
      fila.querySelector("button");


    boton.addEventListener(
      "click",
      () => {

        marcarAtendido(
          registro.id,
          fila
        );

      }
    );


    return fila;

  }


  /* =====================================================
     MARCAR ATENDIDO
  ===================================================== */

  async function marcarAtendido(
    id,
    fila
  ){

    try{

      const {
        error
      } =
        await supabaseClient
          .from("registros")
          .update({
            atendido:true
          })
          .eq(
            "id",
            id
          );


      if(error){

        console.error(
          "Error marcando atendido:",
          error
        );

        alert(
          "No se pudo actualizar el registro."
        );

        return;

      }


      const boton =
        fila.querySelector("button");


      boton.textContent =
        "Atendido";


      boton.className =
        "estado-btn atendido";


    }catch(error){

      console.error(
        "Error:",
        error
      );

    }

  }


  /* =====================================================
     CARGAR REGISTROS
  ===================================================== */

  async function cargarRegistros(){

    lista.innerHTML =
      '<div class="vacio">Cargando registros...</div>';


    try{

      /*
        Primero obtenemos los registros.
      */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("registros")
          .select("*")
          .order(
            "creado_en",
            {
              ascending:false
            }
          )
          .limit(50);


      if(error){

        console.error(
          "Error cargando registros:",
          error
        );

        lista.innerHTML =
          '<div class="vacio">No se pudieron cargar los registros.</div>';

        return;

      }


      lista.innerHTML = "";


      if(
        !data ||
        data.length === 0
      ){

        lista.innerHTML =
          '<div class="vacio">Todavía no hay registros para tu área.</div>';

        return;

      }


      data.forEach(
        registro => {

          lista.appendChild(
            pintarFila(
              registro,
              false
            )
          );

        }
      );


    }catch(error){

      console.error(
        "Error:",
        error
      );

      lista.innerHTML =
        '<div class="vacio">Ocurrió un error cargando los registros.</div>';

    }

  }


  /* =====================================================
     REGISTROS EN TIEMPO REAL
  ===================================================== */

  function escucharNuevos(){

    /*
      Evitar canales duplicados.
    */

    if(canalRegistros){

      supabaseClient
        .removeChannel(
          canalRegistros
        );

    }


    canalRegistros =
      supabaseClient

        .channel(
          "registros-en-vivo"
        )

        .on(

          "postgres_changes",

          {
            event:"INSERT",
            schema:"public",
            table:"registros"
          },

          payload => {

            console.log(
              "Nuevo registro recibido:",
              payload.new
            );


            /*
              Si el registro tiene área,
              solamente mostramos el que
              corresponde al área del usuario.
            */

            if(
              payload.new.area &&
              miArea &&
              payload.new.area !== miArea
            ){

              return;

            }


            const vacio =
              lista.querySelector(
                ".vacio"
              );


            if(vacio){

              vacio.remove();

            }


            /*
              Evitar duplicados.
            */

            const existente =
              document.getElementById(
                "reg-" + payload.new.id
              );


            if(existente){

              return;

            }


            lista.prepend(
              pintarFila(
                payload.new,
                true
              )
            );


            reproducirAviso();

          }

        )

        .subscribe(
          status => {

            console.log(
              "Estado Realtime:",
              status
            );

          }
        );

  }


  /* =====================================================
     NOTIFICACIONES
  ===================================================== */

  btnNotificaciones.addEventListener(
    "click",
    activarNotificaciones
  );


  async function activarNotificaciones(){

    try{

      if(
        !("Notification" in window)
      ){

        alert(
          "Este navegador no soporta notificaciones."
        );

        return;

      }


      if(
        !("serviceWorker" in navigator) ||
        !("PushManager" in window)
      ){

        alert(
          "Este navegador no soporta notificaciones push."
        );

        return;

      }


      if(
        VAPID_PUBLIC_KEY ===
        "TU-VAPID-PUBLIC-KEY"
      ){

        alert(
          "Las notificaciones push todavía no están configuradas. Primero debemos agregar la clave VAPID."
        );

        return;

      }


      const permiso =
        await Notification.requestPermission();


      if(
        permiso !== "granted"
      ){

        alert(
          "No se activaron las notificaciones."
        );

        return;

      }


      const registro =
        await navigator.serviceWorker.ready;


      const suscripcion =
        await registro.pushManager.subscribe({

          userVisibleOnly:true,

          applicationServerKey:
            urlBase64AUint8Array(
              VAPID_PUBLIC_KEY
            )

        });


      const {
        data,
        error:userError
      } =
        await supabaseClient.auth.getUser();


      const user =
        data.user;


      if(
        userError ||
        !user
      ){

        alert(
          "No se pudo identificar al usuario."
        );

        return;

      }


      const {
        error
      } =
        await supabaseClient
          .from("push_suscripciones")
          .insert({

            usuario_id:user.id,

            area:miArea,

            suscripcion:
              suscripcion.toJSON()

          });


      if(error){

        console.error(
          "Error guardando suscripción:",
          error
        );

        alert(
          "No se pudo guardar la suscripción."
        );

        return;

      }


      btnNotificaciones.textContent =
        "🔔 Notificaciones activadas en este dispositivo";


      btnNotificaciones.classList.add(
        "activo"
      );


      btnNotificaciones.disabled =
        true;


    }catch(error){

      console.error(
        "Error activando notificaciones:",
        error
      );

      alert(
        "Ocurrió un error al activar las notificaciones."
      );

    }

  }


  /* =====================================================
     CONVERSIÓN VAPID
  ===================================================== */

  function urlBase64AUint8Array(
    base64String
  ){

    const padding =
      "=".repeat(
        (4 - (
          base64String.length % 4
        )) % 4
      );


    const base64 =
      (
        base64String + padding
      )
      .replace(
        /-/g,
        "+"
      )
      .replace(
        /_/g,
        "/"
      );


    const rawData =
      atob(base64);


    return Uint8Array.from(
      [...rawData].map(
        character =>
          character.charCodeAt(0)
      )
    );

  }


  /* =====================================================
     INICIAR SISTEMA
  ===================================================== */

  iniciar();

</script>
