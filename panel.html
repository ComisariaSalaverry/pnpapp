<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel de registros - Comisaría Salaverry</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --tinta:#0d1f14;
      --musgo:#0b3d24;
      --lino:#f2f1ec;
      --papel:#fff;
      --cobre:#97781a;
      --linea:#d6d3c4;
      --verde:#3c7a56;
      --dorado:#c9a227;
      --rojo:#a13a2a;
      --azul:#365d85;
    }

    *{box-sizing:border-box}

    html{
      min-height:100%;
      overflow-x:hidden;
      overflow-y:auto;
    }

    body{
      margin:0;
      min-height:100vh;
      background:var(--lino);
      color:var(--tinta);
      font-family:'Inter',sans-serif;
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }

    button,input,textarea,select{
      font-family:'Inter',sans-serif;
    }

    #vistaLogin{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .caja-login{
      width:100%;
      max-width:400px;
      background:var(--papel);
      border:1px solid var(--linea);
      border-radius:20px;
      padding:40px 32px;
      box-shadow:0 20px 40px rgba(20,38,31,.1);
    }

    .cabecera-institucional-login,
    .cabecera-institucional{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .cabecera-institucional-login{
      margin-bottom:24px;
      padding-bottom:18px;
      border-bottom:2px solid var(--dorado);
    }

    .logo-institucional{
      width:56px;
      height:56px;
      object-fit:contain;
      flex-shrink:0;
    }

    .texto-institucional .linea1{
      font-size:.75rem;
      font-weight:700;
      color:var(--musgo);
      text-transform:uppercase;
    }

    .texto-institucional .linea2{
      font-size:.85rem;
      color:#5c6b63;
    }

    .caja-login h1{
      font-family:'Fraunces',serif;
      font-size:1.7rem;
      margin:0 0 6px;
    }

    .caja-login p{
      margin:0 0 28px;
      color:#5c6b63;
      font-size:.95rem;
    }

    .caja-login label,
    .caja-modal label{
      display:block;
      font-weight:600;
      font-size:.85rem;
      margin:16px 0 6px;
      color:var(--musgo);
    }

    .caja-login input,
    .editable-input,
    .caja-modal input,
    .caja-modal textarea{
      width:100%;
      padding:12px 13px;
      border-radius:10px;
      border:2px solid var(--linea);
      background:var(--lino);
      color:var(--tinta);
      font-size:.95rem;
      outline:none;
    }

    .caja-login input:focus,
    .editable-input:focus,
    .caja-modal input:focus,
    .caja-modal textarea:focus{
      border-color:var(--musgo);
    }

    .caja-login button{
      width:100%;
      margin-top:22px;
      padding:14px;
      background:var(--musgo);
      color:#fff;
      border:0;
      border-radius:10px;
      font-weight:700;
      font-size:1rem;
      cursor:pointer;
    }

    .caja-login button:disabled{
      opacity:.7;
    }

    .error-login{
      color:var(--rojo);
      font-size:.88rem;
      margin-top:14px;
      min-height:18px;
    }

    #vistaPanel{
      display:none;
      width:100%;
      max-width:900px;
      margin:0 auto;
      padding:32px 24px 70px;
      min-height:100vh;
    }

    .cabecera{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      margin-bottom:22px;
    }

    .cabecera h1{
      font-family:'Fraunces',serif;
      font-size:1.9rem;
      margin:0;
    }

    .sub{
      color:#5c6b63;
      font-size:.9rem;
      margin-top:3px;
    }

    .salir{
      background:#fff;
      border:1px solid var(--linea);
      color:var(--musgo);
      padding:9px 14px;
      border-radius:8px;
      font-weight:600;
      cursor:pointer;
    }

    .filtro-admin{
      display:flex;
      gap:8px;
      margin-bottom:18px;
      overflow-x:auto;
      padding-bottom:5px;
      -webkit-overflow-scrolling:touch;
    }

    .filtro-area{
      flex-shrink:0;
      border:1px solid var(--linea);
      background:#fff;
      color:var(--musgo);
      padding:9px 12px;
      border-radius:8px;
      font-size:.82rem;
      font-weight:600;
      cursor:pointer;
    }

    .filtro-area.activo{
      background:var(--musgo);
      color:#fff;
      border-color:var(--musgo);
    }

    .pestanas{
      display:flex;
      gap:8px;
      margin-bottom:18px;
    }

    .pestana{
      flex:1;
      border:1px solid var(--linea);
      background:#fff;
      color:var(--musgo);
      padding:12px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
    }

    .pestana.activa{
      background:var(--musgo);
      color:#fff;
    }

    .descarga-admin{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:18px;
    }

    .descarga-admin input{
      flex:1;
      min-width:140px;
      padding:10px;
      border:1px solid var(--linea);
      border-radius:8px;
      background:#fff;
    }

    .descarga-admin button{
      padding:10px 16px;
      border:0;
      border-radius:8px;
      background:var(--cobre);
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }

    .buscador{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:18px;
    }

    .buscador input{
      flex:1;
      min-width:160px;
      padding:11px 12px;
      border:1px solid var(--linea);
      border-radius:8px;
      background:#fff;
      outline:none;
    }

    .buscador button{
      padding:10px 16px;
      border:0;
      border-radius:8px;
      background:var(--musgo);
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }

    #btnLimpiarBusqueda{
      background:var(--lino);
      color:var(--musgo);
      border:1px solid var(--linea);
    }

    .btn-notificaciones{
      width:100%;
      margin-bottom:18px;
      padding:13px;
      border-radius:12px;
      border:2px solid var(--musgo);
      background:#fff;
      color:var(--musgo);
      font-weight:700;
      cursor:pointer;
    }

    .btn-notificaciones.activo{
      background:var(--musgo);
      color:#fff;
      cursor:default;
    }

    .lista{
      display:flex;
      flex-direction:column;
      gap:10px;
      width:100%;
    }

    .fila{
      width:100%;
      background:#fff;
      border:1px solid var(--linea);
      border-radius:14px;
      padding:16px 18px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
    }

    .fila.nueva{
      animation:resaltar 1.8s ease;
    }

    @keyframes resaltar{
      0%{
        background:#fdf0e4;
        border-color:var(--cobre);
      }
      100%{
        background:#fff;
        border-color:var(--linea);
      }
    }

    .info-cliente{
      min-width:0;
      flex:1;
    }

    .nombre{
      font-weight:700;
      font-size:1.03rem;
      overflow-wrap:anywhere;
    }

    .dato{
      color:#5c6b63;
      font-size:.84rem;
      margin-top:3px;
      overflow-wrap:anywhere;
    }

    .area{
      color:var(--musgo);
      font-size:.84rem;
      font-weight:600;
      margin-top:3px;
      overflow-wrap:anywhere;
    }

    .hora{
      color:#5c6b63;
      font-size:.81rem;
      margin-top:4px;
    }

    .motivo-atendido{
      margin-top:7px;
      padding-top:7px;
      border-top:1px dashed var(--linea);
      font-size:.82rem;
      overflow-wrap:anywhere;
    }

    .acciones-registro,
    .acciones-cita{
      display:flex;
      flex-direction:column;
      gap:7px;
      flex-shrink:0;
      min-width:130px;
    }

    .btn{
      border:0;
      padding:9px 12px;
      border-radius:8px;
      font-weight:700;
      font-size:.8rem;
      cursor:pointer;
      white-space:nowrap;
    }

    .btn-atendido{
      background:#e2ede6;
      color:var(--verde);
    }

    .btn-pendiente{
      background:#fde8da;
      color:var(--cobre);
    }

    .btn-motivo,
    .btn-editar{
      background:#eef0e4;
      color:var(--musgo);
    }

    .btn-editar{
      border:0;
    }

    .btn-eliminar{
      background:#f5dfdc;
      color:var(--rojo);
    }

    .btn-llegada{
      background:var(--musgo);
      color:#fff;
    }

    .btn-cita-atendida{
      background:#e2ede6;
      color:var(--verde);
    }

    .btn-cita-cancelar{
      background:#f5dfdc;
      color:var(--rojo);
    }

    .btn-cita-no{
      background:#eee;
      color:#555;
    }

    .estado-cita{
      display:inline-block;
      margin-top:7px;
      padding:5px 9px;
      border-radius:7px;
      font-size:.76rem;
      font-weight:700;
      background:#eee;
    }

    .estado-Pendiente{
      background:#fde8da;
      color:var(--cobre);
    }

    .estado-Llegó,
    .estado-Atendida{
      background:#e2ede6;
      color:var(--verde);
    }

    .estado-Cancelada{
      background:#f5dfdc;
      color:var(--rojo);
    }

    .estado-No{
      background:#eee;
      color:#555;
    }

    .vacio{
      text-align:center;
      padding:55px 20px;
      color:#5c6b63;
    }

    .overlay-modal{
      position:fixed;
      inset:0;
      background:rgba(13,31,20,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:100;
      padding:20px;
    }

    .caja-modal{
      width:100%;
      max-width:430px;
      max-height:90vh;
      overflow-y:auto;
      background:#fff;
      border-radius:16px;
      padding:28px 26px;
      box-shadow:0 20px 50px rgba(13,31,20,.25);
    }

    .caja-modal h2{
      font-family:'Fraunces',serif;
      font-size:1.3rem;
      margin:0 0 18px;
    }

    .caja-modal textarea{
      resize:vertical;
    }

    .error-modal{
      color:var(--rojo);
      font-size:.85rem;
      min-height:18px;
      margin-top:8px;
    }

    .botones-modal{
      display:flex;
      gap:10px;
      margin-top:16px;
    }

    .btn-cancelar-modal,
    .btn-guardar-modal{
      flex:1;
      padding:12px;
      border-radius:10px;
      border:0;
      font-weight:700;
      cursor:pointer;
    }

    .btn-cancelar-modal{
      background:var(--lino);
      color:var(--musgo);
      border:1px solid var(--linea);
    }

    .btn-guardar-modal{
      background:var(--musgo);
      color:#fff;
    }

    @media(max-width:600px){
      #vistaPanel{
        padding:24px 14px 80px;
      }

      .cabecera{
        align-items:flex-start;
      }

      .cabecera h1{
        font-size:1.55rem;
      }

      .salir{
        width:100%;
      }

      .fila{
        padding:14px;
      }

      .acciones-registro,
      .acciones-cita{
        min-width:120px;
      }

      .btn{
        padding:8px 9px;
        font-size:.75rem;
      }
    }

    @media(max-width:430px){
      .fila{
        flex-direction:column;
      }

      .acciones-registro,
      .acciones-cita{
        width:100%;
        min-width:0;
      }

      .btn{
        width:100%;
      }

      .pestanas{
        position:sticky;
        top:0;
        z-index:5;
        background:var(--lino);
        padding:5px 0;
      }
    }
  </style>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1f3d31">
</head>

<body>

  <!-- LOGIN -->

  <div id="vistaLogin">

    <div class="caja-login">

      <div class="cabecera-institucional-login">

        <img
          src="./logo.png"
          alt="Comisaría Salaverry"
          class="logo-institucional"
        >

        <div class="texto-institucional">

          <div class="linea1">
            Comisaría Salaverry
          </div>

          <div class="linea2">
            Panel de área
          </div>

        </div>

      </div>

      <p>
        Ingrese con la cuenta de su área para ver los registros.
      </p>

      <label for="correo">
        Correo
      </label>

      <input
        type="email"
        id="correo"
        autocomplete="username"
        placeholder="correo@pnp.pe"
      >

      <label for="clave">
        Contraseña
      </label>

      <input
        type="password"
        id="clave"
        autocomplete="current-password"
      >

      <button id="btnEntrar">
        Ingresar
      </button>

      <div
        class="error-login"
        id="errorLogin"
      ></div>

    </div>

  </div>


  <!-- PANEL -->

  <div id="vistaPanel">

    <div class="cabecera">

      <div class="cabecera-institucional">

        <img
          src="./logo.png"
          alt="Comisaría Salaverry"
          class="logo-institucional"
        >

        <div>

          <h1 id="nombreArea">
            Registros
          </h1>

          <div
            class="sub"
            id="subtituloPanel"
          >
            Se actualiza automáticamente.
          </div>

        </div>

      </div>

      <button
        class="salir"
        id="btnSalir"
      >
        Cerrar sesión
      </button>

    </div>


    <!-- FILTRO ADMIN -->

    <div
      id="filtroAdmin"
      class="filtro-admin"
      style="display:none;"
    >

      <button
        class="filtro-area activo"
        data-area="TODAS"
      >
        Todas
      </button>

      <button
        class="filtro-area"
        data-area="Sección de Delitos, Faltas y Tránsito"
      >
        Sección de Delitos, Faltas y Tránsito
      </button>

      <button
        class="filtro-area"
        data-area="Familia"
      >
        Familia
      </button>

      <button
        class="filtro-area"
        data-area="Policía comunitaria"
      >
        Policía comunitaria
      </button>

      <button
        class="filtro-area"
        data-area="Secretaría"
      >
        Secretaría
      </button>

      <button
        class="filtro-area"
        data-area="Comisario"
      >
        Comisario
      </button>

      <button
        class="filtro-area"
        data-area="Copias certificadas y medidas de protección"
      >
        Copias certificadas y medidas de protección
      </button>

    </div>


    <!-- PESTAÑAS -->

    <div class="pestanas">

      <button
        id="btnTabRegistros"
        class="pestana activa"
      >
        REGISTROS
      </button>

      <button
        id="btnTabCitas"
        class="pestana"
      >
        CITAS
      </button>

    </div>


    <!-- REGISTROS -->

    <div id="seccionRegistros">

      <div
        id="descargaAdmin"
        class="descarga-admin"
        style="display:none;"
      >

        <input
          type="date"
          id="fechaDesde"
        >

        <input
          type="date"
          id="fechaHasta"
        >

        <button id="btnDescargar">
          ⬇ Descargar CSV
        </button>

      </div>


      <div class="buscador">

        <input
          type="text"
          id="inputBuscar"
          placeholder="Buscar por DNI o nombre"
        >

        <button id="btnBuscar">
          Buscar
        </button>

        <button
          id="btnLimpiarBusqueda"
          style="display:none;"
        >
          Limpiar
        </button>

      </div>


      <button
        id="btnNotificaciones"
        class="btn-notificaciones"
      >
        🔔 Activar notificaciones en este dispositivo
      </button>


      <div
        class="lista"
        id="listaRegistros"
      ></div>

    </div>


    <!-- CITAS -->

    <div
      id="seccionCitas"
      style="display:none;"
    >

      <div
        class="lista"
        id="listaCitas"
      ></div>

    </div>

  </div>


  <!-- MODAL ATENDIDO -->

  <div
    id="overlayAtendido"
    class="overlay-modal"
    style="display:none;"
  >

    <div class="caja-modal">

      <h2>
        Información de atención
      </h2>

      <label for="motivoAtendido">
        Motivo de la visita
      </label>

      <input
        type="text"
        id="motivoAtendido"
        maxlength="150"
        placeholder="Consulta, denuncia, trámite..."
      >

      <label for="detalleAtendido">
        Especificar
      </label>

      <textarea
        id="detalleAtendido"
        rows="4"
        maxlength="500"
        placeholder="Detalle adicional"
      ></textarea>

      <div
        class="error-modal"
        id="errorModal"
      ></div>

      <div class="botones-modal">

        <button
          id="btnCancelarAtendido"
          class="btn-cancelar-modal"
        >
          Cancelar
        </button>

        <button
          id="btnGuardarAtendido"
          class="btn-guardar-modal"
        >
          Guardar
        </button>

      </div>

    </div>

  </div>


  <!-- MODAL EDITAR -->

  <div
    id="overlayEditar"
    class="overlay-modal"
    style="display:none;"
  >

    <div class="caja-modal">

      <h2>
        Editar registro
      </h2>

      <label for="editarDni">
        DNI
      </label>

      <input
        type="text"
        id="editarDni"
        maxlength="20"
      >

      <label for="editarNombre">
        Nombre completo
      </label>

      <input
        type="text"
        id="editarNombre"
        maxlength="150"
      >

      <label for="editarCelular">
        Celular
      </label>

      <input
        type="text"
        id="editarCelular"
        maxlength="30"
      >

      <div
        class="error-modal"
        id="errorEditar"
      ></div>

      <div class="botones-modal">

        <button
          id="btnCancelarEditar"
          class="btn-cancelar-modal"
        >
          Cancelar
        </button>

        <button
          id="btnGuardarEditar"
          class="btn-guardar-modal"
        >
          Guardar cambios
        </button>

      </div>

    </div>

  </div>


<script>

  const SUPABASE_URL =
    "https://cthpbxqwsjcgpdfqkdwr.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_qTNkWQAQLrzS2-81BpeDeA_DFDCrVol";

  const VAPID_PUBLIC_KEY =
    "BHG6sCGAQQmYuGMRmrJ4EYKd55Bzngbc7WQdJuFpjHgFzs-zbQYQeof-yerGrD_yjIqQijnzdvqySvrehpeZgUA";


  const AREAS = [
    "Sección de Delitos, Faltas y Tránsito",
    "Familia",
    "Policía comunitaria",

    "Comisario",

  const supabaseClient =

    );


  const vistaLogin =
    document.getElementById("vistaLogin");

  const vistaPanel =

  const btnEntrar =

  const btnSalir =

  const errorLogin =
    document.getElementById("errorLogin");

  const correoInput =
    document.getElementById("correo");

  const claveInput =
    document.getElementById("clave");

  const nombreAreaEl =
    document.getElementById("nombreArea");

  const subtituloPanel =
    document.getElementById("subtituloPanel");

  const filtroAdmin =
    document.getElementById("filtroAdmin");

  const descargaAdmin =
    document.getElementById("descargaAdmin");

  const listaRegistros =
    document.getElementById("listaRegistros");

  const listaCitas =
    document.getElementById("listaCitas");

  const seccionRegistros =

  const seccionCitas =

  const btnTabRegistros =

  const btnTabCitas =

  let miArea = null;
  let miRol = "usuario";
  let areaFiltroAdmin = "TODAS";

  let canalRegistros = null;

  let registroPendienteId = null;
  let filaPendiente = null;

  let registroEditarId = null;


  function escaparHTML(texto){

    const div =
      document.createElement("div");

    div.textContent =
      texto ?? "";

    return div.innerHTML;
  }


  function formatoHora(fechaISO){

    if(!fechaISO){
      return "";
    }

    return new Date(fechaISO).toLocaleString(
      "es-PE",
      {
        day:"2-digit",
        month:"short",
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }


  function formatoFechaCita(fecha){

    if(!fecha){
      return "";
    }

    const partes =
      fecha.split("-");

    if(partes.length !== 3){
      return fecha;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  function reproducirAviso(){

    try{

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioContext){
        return;
      }

      const ctx =
        new AudioContext();

      const osc =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      osc.type = "sine";

      osc.frequency.setValueAtTime(
        880,
        ctx.currentTime
      );

      osc.frequency.setValueAtTime(
        660,
        ctx.currentTime + .12
      );

      gain.gain.setValueAtTime(
        .15,
        ctx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + .4
      );

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();

      osc.stop(
        ctx.currentTime + .4
      );

    }catch(error){

      console.error(
        "Error de audio:",
        error
      );

    }

  }

  async function cargarRegistros(){

    listaRegistros.innerHTML =
      '<div class="vacio">Cargando registros...</div>';


    try{

      let consulta =
        supabaseClient
          .from("registros")
          .select("*")
          .order(
            "creado_en",
            {
              ascending:false
            }
          )
          .limit(50);


      if(miRol === "admin"){

        if(areaFiltroAdmin !== "TODAS"){

          consulta =
            consulta.eq(
              "area",
              areaFiltroAdmin
            );

        }

      }else{

        consulta =
          consulta.eq(
            "area",
            miArea
          );

      }


      const {
        data,
        error
      } =
        await consulta;


      if(error){

        console.error(
          "Error cargando registros:",
          error
        );

        listaRegistros.innerHTML =
          '<div class="vacio">No se pudieron cargar los registros.</div>';

        return;
      }


      listaRegistros.innerHTML = "";


      if(!data || data.length === 0){

        listaRegistros.innerHTML =
          miRol === "admin"
            ? (
              areaFiltroAdmin === "TODAS"
                ? '<div class="vacio">Todavía no hay registros.</div>'
                : `<div class="vacio">Todavía no hay registros para ${escaparHTML(areaFiltroAdmin)}.</div>`
            )
            : '<div class="vacio">Todavía no hay registros para tu área.</div>';

        return;
      }


      data.forEach(
        registro => {

          listaRegistros.appendChild(
            pintarFilaRegistro(
              registro,
              false
            )
          );

        }
      );


    }catch(error){

      console.error(
        "Error:",
        error
      );

      listaRegistros.innerHTML =
        '<div class="vacio">Ocurrió un error cargando los registros.</div>';

    }

  }


  function escucharRegistros(){

    if(canalRegistros){

      supabaseClient
        .removeChannel(
          canalRegistros
        );

    }


    canalRegistros =
      supabaseClient
        .channel(
          "registros-en-vivo"
        )
        .on(
          "postgres_changes",
          {
            event:"INSERT",
            schema:"public",
            table:"registros"
          },
          payload => {

            if(
              miRol !== "admin" &&
              payload.new.area !== miArea
            ){
              return;
            }


            if(
              miRol === "admin" &&
              areaFiltroAdmin !== "TODAS" &&
              payload.new.area !== areaFiltroAdmin
            ){
              return;
            }


            if(
              seccionRegistros.style.display === "none"
            ){
              reproducirAviso();
              return;
            }


            const existente =
              document.getElementById(
                "reg-" + payload.new.id
              );


            if(existente){
              return;
            }


            const vacio =
              listaRegistros.querySelector(
                ".vacio"
              );


            if(vacio){
              vacio.remove();
            }


            listaRegistros.prepend(
              pintarFilaRegistro(
                payload.new,
                true
              )
            );


            reproducirAviso();

          }
        )
        .on(
          "postgres_changes",
          {
            event:"DELETE",
            schema:"public",
            table:"registros"
          },
          payload => {

            if(
              !payload.old ||
              !payload.old.id
            ){
              return;
            }


            const fila =
              document.getElementById(
                "reg-" + payload.old.id
              );


            if(fila){
              fila.remove();
            }

          }
        )
        .subscribe(
          status => {

            console.log(
              "Estado Realtime:",
              status
            );

          }
        );

  }

  async function buscarRegistros(){

    const termino =
      inputBuscar.value.trim();


    if(!termino){

      alert(
        "Escribe un DNI o nombre para buscar."
      );

      return;
    }


    btnBuscar.disabled =
      true;

    btnBuscar.textContent =
      "Buscando...";


    listaRegistros.innerHTML =
      '<div class="vacio">Buscando...</div>';


    try{

      let consulta =
        supabaseClient
          .from("registros")
          .select("*")
          .or(
            `dni.ilike.%${termino}%,nombre.ilike.%${termino}%`
          )
          .order(
            "creado_en",
            {ascending:false}
          )
          .limit(50);


      if(miRol === "admin"){

        if(
          areaFiltroAdmin !==
          "TODAS"
        ){

          consulta =
            consulta.eq(
              "area",
              areaFiltroAdmin
            );

        }

      }else{

        consulta =
          consulta.eq(
            "area",
            miArea
          );

      }


      const {
        data,
        error
      } =
        await consulta;


      if(error){

        console.error(
          "Error buscando:",
          error
        );

        listaRegistros.innerHTML =
          '<div class="vacio">No se pudo realizar la búsqueda.</div>';

        return;
      }


      listaRegistros.innerHTML =
        "";


      if(!data || data.length === 0){

        listaRegistros.innerHTML =
          '<div class="vacio">No se encontraron registros.</div>';

        return;
      }


      data.forEach(
        registro => {

          listaRegistros.appendChild(
            pintarFilaRegistro(
              registro,
              false
            )
          );

        }
      );

        "inline-block";


    }catch(error){

      console.error(
        "Error:",
        error
      );

      listaRegistros.innerHTML =
        '<div class="vacio">No se pudo realizar la búsqueda.</div>';

    }finally{

      btnBuscar.disabled =
        false;

      btnBuscar.textContent =
        "Buscar";

    }

  }

  async function activarNotificaciones(){

    try{

      if(!("Notification" in window)){

        alert(
          "Este navegador no soporta notificaciones."
        );

        return;
      }


      if(
        !("serviceWorker" in navigator) ||
        !("PushManager" in window)
      ){

        alert(
          "Este navegador no soporta notificaciones push."
        );

        return;
      }


      if(
        VAPID_PUBLIC_KEY ===
        "TU-VAPID-PUBLIC-KEY"
      ){

        alert(
          "Las notificaciones push todavía no están configuradas."
        );

        return;
      }


      const permiso =
        await Notification.requestPermission();


      if(permiso !== "granted"){

        alert(
          "No se activaron las notificaciones."
        );

        return;
      }


      const registro =
        await navigator.serviceWorker.ready;


      const suscripcion =
        await registro.pushManager.subscribe({
          userVisibleOnly:true,
          applicationServerKey:
            urlBase64AUint8Array(
              VAPID_PUBLIC_KEY
            )
        });


      const {
        data,
        error:userError
      } =
        await supabaseClient.auth.getUser();


      const user =
        data.user;


      if(userError || !user){

        alert(
          "No se pudo identificar al usuario."
        );

        return;
      }


      const areaSuscripcion =
        miRol === "admin"
          ? "TODAS"
          : miArea;


      const {
        error
      } =
        await supabaseClient
          .from("push_suscripciones")
          .insert({
            usuario_id:user.id,
            area:areaSuscripcion,
            suscripcion:
              suscripcion.toJSON()
          });


      if(error){

        console.error(
          "Error guardando suscripción:",
          error
        );

        alert(
          "No se pudo guardar la suscripción."
        );

        return;
      }


      btnNotificaciones.textContent =
        "🔔 Notificaciones activadas en este dispositivo";

      btnNotificaciones.classList.add(
        "activo"
      );

      btnNotificaciones.disabled =
        true;


    }catch(error){

      console.error(
        "Error activando notificaciones:",
        error
      );

      alert(
        "Ocurrió un error al activar las notificaciones."
      );

    }

  }


  function urlBase64AUint8Array(
    base64String
  ){

    const padding =
      "=".repeat(
        (4 - (
          base64String.length % 4
        )) % 4
      );


    const base64 =
      (
        base64String + padding
      )
      .replace(
        /-/g,
        "+"
      )
      .replace(
        /_/g,
        "/"
      );


    const rawData =
      atob(base64);


    return Uint8Array.from(
      [...rawData].map(
        character =>
          character.charCodeAt(0)
      )
    );

  }


  /* ==========================
     CSV
  ========================== */


  const inputFechaDesde =
    document.getElementById(
      "fechaDesde"
    );

  const inputFechaHasta =
    document.getElementById(
      "fechaHasta"
    );

  const btnDescargar =
    document.getElementById(
      "btnDescargar"
    );


  const hoy =
    new Date()
      .toISOString()
      .slice(0,10);


  inputFechaDesde.value =
    hoy;

  inputFechaHasta.value =
    hoy;


  btnDescargar.addEventListener(
    "click",
    async () => {

      if(miRol !== "admin"){

        alert(
          "Solo el administrador puede descargar registros."
        );

        return;
      }


      const desde =
        inputFechaDesde.value;

      const hasta =
        inputFechaHasta.value;


      if(!desde || !hasta){

        alert(
          "Selecciona las fechas."
        );

        return;
      }


      if(desde > hasta){

        alert(
          "La fecha desde no puede ser posterior a la fecha hasta."
        );

        return;
      }


      btnDescargar.disabled =
        true;

      btnDescargar.textContent =
        "Generando...";


      try{

        const inicio =
          `${desde}T00:00:00-05:00`;

        const fin =
          `${hasta}T23:59:59-05:00`;


        let consulta =
          supabaseClient
            .from("registros")
            .select(
              "dni,nombre,celular,area,creado_en,atendido,motivo,detalle"
            )
            .gte(
              "creado_en",
              inicio
            )
            .lte(
              "creado_en",
              fin
            )
            .order(
              "area",
              {ascending:true}
            )
            .order(
              "creado_en",
              {ascending:true}
            );


        if(
          areaFiltroAdmin !==
          "TODAS"
        ){

          consulta =
            consulta.eq(
              "area",
              areaFiltroAdmin
            );

        }


        const {
          data,
          error
        } =
          await consulta;


        if(error){

          console.error(
            "Error CSV:",
            error
          );

          alert(
            "No se pudo generar el archivo."
          );

          return;
        }


        if(!data || data.length === 0){

          alert(
            "No hay registros en ese rango."
          );

          return;
        }


        const encabezados = [
          "DNI",
          "Nombre completo",
          "Celular",
          "Área",
          "Fecha y hora",
          "Atendido",
          "Motivo",
          "Detalle"
        ];


        const filas =
          data.map(
            r => [
              `="${r.dni || ""}"`,
              r.nombre || "",
              r.celular
                ? `="${r.celular}"`
                : "",
              r.area || "",
              new Date(
                r.creado_en
              ).toLocaleString(
                "es-PE"
              ),
              r.atendido
                ? "Sí"
                : "No",
              r.motivo || "",
              r.detalle || ""
            ]
          );


        const csv =
          [encabezados,...filas]
            .map(
              fila =>
                fila
                  .map(
                    campo =>
                      `"${String(campo).replace(/"/g,'""')}"`
                  )
                  .join(",")
            )
            .join("\n");


        const blob =
          new Blob(
            ["\uFEFF" + csv],
            {
              type:
                "text/csv;charset=utf-8;"
            }
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const nombreArea =
          areaFiltroAdmin === "TODAS"
            ? "TODAS_LAS_AREAS"
            : areaFiltroAdmin.replace(
                /\s+/g,
                "_"
              );


        const enlace =
          document.createElement(
            "a"
          );

        enlace.href =
          url;

        enlace.download =
          `registros_${nombreArea}_${desde}_a_${hasta}.csv`;

        enlace.click();


        URL.revokeObjectURL(
          url
        );


      }finally{

        btnDescargar.disabled =
          false;

        btnDescargar.textContent =
          "⬇ Descargar CSV";

      }

    }
  );


  iniciar();
